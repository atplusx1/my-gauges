<!DOCTYPE html> 
<html lang="ar" dir="rtl"> 
<head> 
  <meta charset="utf-8"> 
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
  <title>ENVIGUARD SYS Dashboard</title> 
  
  <!-- مكتبات Firebase لقراءة البيانات فورياً -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style> 
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: 'Consolas', 'Courier New', monospace; 
    } 
    body { 
      background-color: #080c14; 
      color: #ffffff; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: flex-start; 
      min-height: 100vh; 
      padding: 12px; 
      gap: 15px; 
    } 

    .top-bar {
      width: 100%;
      max-width: 360px;
      display: flex;
      justify-content: flex-end;
    }
    .btn-lang {
      background: #111827;
      border: 1px solid #00d2d3;
      color: #00d2d3;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      font-family: inherit;
      transition: all 0.3s;
    }
    .btn-lang:hover {
      background: #00d2d3;
      color: #000;
    }

    /* النمط الموحد للشاشات المستطيلة (OLED) */
    .oled-screen { 
      background: #000000; 
      border: 2px solid #1f293d; 
      border-radius: 12px; 
      padding: 12px 20px; 
      width: 100%; 
      max-width: 360px; 
      box-shadow: 0 0 12px rgba(0, 210, 211, 0.15); 
      transition: all 0.5s ease-in-out;
    } 
    .oled-title { 
      text-align: center; 
      font-size: 16px; 
      font-weight: bold; 
      color: #00d2d3; 
      letter-spacing: 1.5px; 
      border-bottom: 1px dashed #232f48; 
      padding-bottom: 6px; 
      margin-bottom: 10px; 
      transition: color 0.3s;
    } 
    .oled-row { 
      display: flex; 
      justify-content: space-between; 
      align-items: center;
      font-size: 14px; 
      margin: 6px 0; 
      color: #00ffcc; 
    } 
    .oled-value { 
      color: #ffffff; 
      font-weight: bold; 
      transition: all 0.3s ease;
    } 
    .oled-select {
      background: #080c14;
      border: 1px solid #00d2d3;
      color: #00ffcc;
      padding: 4px 8px;
      border-radius: 6px;
      font-family: inherit;
      outline: none;
      width: 60%;
    }

    /* --- أنيميشن وتأثيرات كروت النباتات والأنماط --- */
    .card-plant-active {
      border-color: #2ed573 !important;
      box-shadow: 0 0 18px rgba(46, 213, 115, 0.35) !important;
    }

    /* تأثير وضع التشغيل AUTO / MANUAL */
    .card-mode-auto {
      border-color: #ff9f43 !important;
      box-shadow: 0 0 18px rgba(255, 159, 67, 0.35) !important;
    }
    .card-mode-manual {
      border-color: #a55eea !important;
      box-shadow: 0 0 18px rgba(165, 94, 234, 0.4) !important;
    }

    /* تأثيرات المروحة */
    .card-fan-off {
      border-color: #ff4757 !important;
      box-shadow: 0 0 12px rgba(255, 71, 87, 0.2) !important;
    }
    .card-fan-on {
      border-color: #00d2d3 !important;
      box-shadow: 0 0 22px rgba(0, 210, 211, 0.5) !important;
      animation: pulseFanCard 2s infinite alternate;
    }

    @keyframes pulseFanCard {
      from { box-shadow: 0 0 12px rgba(0, 210, 211, 0.3); }
      to { box-shadow: 0 0 25px rgba(0, 210, 211, 0.7); }
    }

    /* أنيميشن وألوان التنبيه لشاشات الحرارة والرطوبة */
    .card-normal {
      border-color: #2ed573 !important;
      box-shadow: 0 0 12px rgba(46, 213, 115, 0.3) !important;
    }
    .card-normal .status-val { color: #2ed573; }

    .card-high {
      border-color: #ff4757 !important;
      box-shadow: 0 0 18px rgba(255, 71, 87, 0.6) !important;
      animation: blinkRed 1s infinite alternate;
    }
    .card-high .status-val { color: #ff4757; }

    .card-low {
      border-color: #1e90ff !important;
      box-shadow: 0 0 18px rgba(30, 144, 255, 0.6) !important;
      animation: blinkBlue 1s infinite alternate;
    }
    .card-low .status-val { color: #1e90ff; }

    @keyframes blinkRed {
      from { border-color: #ff4757; box-shadow: 0 0 10px rgba(255, 71, 87, 0.4); }
      to { border-color: #ff4757; box-shadow: 0 0 25px rgba(255, 71, 87, 0.8); }
    }
    @keyframes blinkBlue {
      from { border-color: #1e90ff; box-shadow: 0 0 10px rgba(30, 144, 255, 0.4); }
      to { border-color: #1e90ff; box-shadow: 0 0 25px rgba(30, 144, 255, 0.8); }
    }

    /* تأثير دوران المروحة وتوهجها */
    .fan-icon {
      display: inline-block;
      transition: all 0.5s linear;
    }
    .fan-spinning {
      animation: spin 0.8s linear infinite;
      color: #00d2d3;
      text-shadow: 0 0 8px #00d2d3;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .status-on { color: #2ed573 !important; } 
    .status-off { color: #ff4757 !important; } 
    .status-warn { color: #ffa502 !important; } 

    /* العدادات الدائرية */
    .gauges-wrapper { 
      display: flex; 
      justify-content: space-around; 
      width: 100%; 
      max-width: 360px; 
      gap: 8px; 
    } 
    .gauge-card { 
      background: #111827; 
      border: 1px solid #1f293d; 
      border-radius: 10px; 
      padding: 8px; 
      flex: 1; 
      text-align: center; 
    } 
    .gauge-title { 
      font-size: 11px; 
      color: #9ca3af; 
      margin-bottom: 6px; 
    } 
    .circle-outer { 
      position: relative; 
      width: 70px; 
      height: 70px; 
      margin: 0 auto; 
      border-radius: 50%; 
      background: conic-gradient(var(--color) calc(var(--percent) * 1%), #1f293d 0); 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      transition: background 0.4s ease, box-shadow 0.4s ease; 
      box-shadow: 0 0 8px var(--color); 
    } 
    .circle-inner { 
      width: 56px; 
      height: 56px; 
      background: #111827; 
      border-radius: 50%; 
      display: flex; 
      flex-direction: column; 
      justify-content: center; 
      align-items: center; 
    } 
    .val { 
      font-size: 13px; 
      font-weight: bold; 
    } 
    .unit { 
      font-size: 8px; 
      color: #6b7280; 
    } 
  </style> 
</head> 
<body> 

  <!-- زر تغيير اللغة -->
  <div class="top-bar">
    <button class="btn-lang" onclick="toggleLanguage()" id="langBtn">English 🌐</button>
  </div>

  <!-- شاشة اختيار النبات -->
  <div class="oled-screen card-plant-active" id="cardPlant"> 
    <div class="oled-title" id="t-plantTitle">🌿 النبات المختار</div> 
    <div class="oled-row"> 
      <span id="t-selectPlant">اختيار النبات:</span> 
      <select id="plantSelector" class="oled-select" onchange="selectPlant(this.value)">
        <option value="">يرجى إضافة نبات</option>
      </select>
    </div> 
    <div class="oled-row"> 
      <span id="t-activePlant">اسم النبات:</span> 
      <span class="oled-value" id="oledPlantName" style="color: #2ed573;">--</span> 
    </div> 
  </div> 

  <!-- شاشة درجة الحرارة -->
  <div class="oled-screen card-normal" id="cardTemp"> 
    <div class="oled-title" id="t-cardTempTitle">🌡️ درجة الحرارة</div> 
    <div class="oled-row"> 
      <span id="t-tempValLabel">القراءة الحالية:</span> 
      <span class="oled-value" id="lblCardTemp">0.0 °C</span> 
    </div> 
    <div class="oled-row"> 
      <span id="t-tempStatusLabel">الحالة:</span> 
      <span class="oled-value status-val" id="lblCardTempStatus">طبيعي</span> 
    </div> 
  </div> 

  <!-- شاشة نسبة الرطوبة -->
  <div class="oled-screen card-normal" id="cardHum"> 
    <div class="oled-title" id="t-cardHumTitle">💧 نسبة الرطوبة</div> 
    <div class="oled-row"> 
      <span id="t-humValLabel">القراءة الحالية:</span> 
      <span class="oled-value" id="lblCardHum">0.0 %</span> 
    </div> 
    <div class="oled-row"> 
      <span id="t-humStatusLabel">الحالة:</span> 
      <span class="oled-value status-val" id="lblCardHumStatus">طبيعي</span> 
    </div> 
  </div> 

  <!-- شاشة النظام والنمط -->
  <div class="oled-screen card-mode-auto" id="cardSysMode"> 
    <div class="oled-title">ENVIGUARD SYS</div> 
    <div class="oled-row"> 
      <span id="t-mode">نمط التشغيل:</span> 
      <span class="oled-value" id="oledMode" style="color: #ff9f43;">AUTO</span> 
    </div> 
    <div class="oled-row"> 
      <span id="t-sys">حالة النظام:</span> 
      <span class="oled-value status-on" id="statusSys">سليم</span> 
    </div> 
  </div> 

  <!-- شاشة التحكم بالأجهزة (المروحة) -->
  <div class="oled-screen card-fan-off" id="cardFan"> 
    <div class="oled-title" id="t-actTitle">حالة الأجهزة</div> 
    <div class="oled-row"> 
      <span id="t-fan">المروحة:</span> 
      <span>
        <span class="fan-icon" id="fanIcon">🌀</span>
        <span class="oled-value status-off" id="statusFan">OFF</span> 
      </span>
    </div> 
  </div> 

  <!-- العدادات الدائرية -->
  <div class="gauges-wrapper"> 
    <div class="gauge-card"> 
      <div class="gauge-title" id="t-gTemp">مؤشر الحرارة</div> 
      <div class="circle-outer" id="tempRing" style="--color: #00d2d3; --percent: 0;"> 
        <div class="circle-inner"> 
          <span class="val" id="gTemp">0</span> 
          <span class="unit">°C</span> 
        </div> 
      </div> 
    </div> 

    <div class="gauge-card"> 
      <div class="gauge-title" id="t-gHum">مؤشر الرطوبة</div> 
      <div class="circle-outer" id="humRing" style="--color: #00d2d3; --percent: 0;"> 
        <div class="circle-inner"> 
          <span class="val" id="gHum">0</span> 
          <span class="unit">%</span> 
        </div> 
      </div> 
    </div> 
  </div> 

  <script> 
    let currentLang = 'ar';
    const dict = {
      ar: {
        langBtn: "English 🌐",
        plantTitle: "🌿 النبات المختار",
        selectPlant: "اختيار النبات:",
        noPlants: "يرجى إضافة نبات",
        activePlant: "اسم النبات:",
        cardTempTitle: "🌡️ درجة الحرارة",
        cardHumTitle: "💧 نسبة الرطوبة",
        valLabel: "القراءة الحالية:",
        statusLabel: "الحالة:",
        mode: "نمط التشغيل:",
        sys: "حالة النظام:",
        actTitle: "حالة الأجهزة",
        fan: "المروحة:",
        gTemp: "مؤشر الحرارة",
        gHum: "مؤشر الرطوبة",
        normal: "طبيعي",
        high: "إنذار: مرتفعة 🚨",
        low: "إنذار: منخفضة 🥶",
        ok: "سليم",
        warning: "تحذير 🚨"
      },
      en: {
        langBtn: "عربي 🌐",
        plantTitle: "🌿 ACTIVE PLANT",
        selectPlant: "SELECT PLANT:",
        noPlants: "Please add a plant",
        activePlant: "PLANT NAME:",
        cardTempTitle: "🌡️ TEMPERATURE",
        cardHumTitle: "💧 HUMIDITY",
        valLabel: "Current Value:",
        statusLabel: "Status:",
        mode: "SYSTEM MODE:",
        sys: "SYSTEM STATUS:",
        actTitle: "ACTUATORS STATUS",
        fan: "FAN:",
        gTemp: "TEMP GAUGE",
        gHum: "HUM GAUGE",
        normal: "NORMAL",
        high: "ALARM: HIGH 🚨",
        low: "ALARM: LOW 🥶",
        ok: "OK",
        warning: "WARNING 🚨"
      }
    };

    function toggleLanguage() {
      currentLang = currentLang === 'ar' ? 'en' : 'ar';
      document.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
      const t = dict[currentLang];
      
      document.getElementById('langBtn').innerText = t.langBtn;
      document.getElementById('t-plantTitle').innerText = t.plantTitle;
      document.getElementById('t-selectPlant').innerText = t.selectPlant;
      document.getElementById('t-activePlant').innerText = t.activePlant;
      document.getElementById('t-cardTempTitle').innerText = t.cardTempTitle;
      document.getElementById('t-cardHumTitle').innerText = t.cardHumTitle;
      document.getElementById('t-tempValLabel').innerText = t.valLabel;
      document.getElementById('t-tempStatusLabel').innerText = t.statusLabel;
      document.getElementById('t-humValLabel').innerText = t.valLabel;
      document.getElementById('t-humStatusLabel').innerText = t.statusLabel;
      document.getElementById('t-mode').innerText = t.mode;
      document.getElementById('t-sys').innerText = t.sys;
      document.getElementById('t-actTitle').innerText = t.actTitle;
      document.getElementById('t-fan').innerText = t.fan;
      document.getElementById('t-gTemp').innerText = t.gTemp;
      document.getElementById('t-gHum').innerText = t.gHum;

      renderSystemData();
    }

    // --- إعداد Firebase ---
    const firebaseConfig = {
      databaseURL: "https://envigurd-default-rtdb.firebaseio.com"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let plantsList = {};
    let activePlantKey = "";
    let sysData = {};

    db.ref('plants').on('value', (snapshot) => {
      plantsList = snapshot.val() || {};
      const select = document.getElementById('plantSelector');
      select.innerHTML = '';
      
      let keys = Object.keys(plantsList);

      if (keys.length === 0) {
        let opt = document.createElement('option');
        opt.value = "";
        opt.innerText = dict[currentLang].noPlants;
        select.appendChild(opt);
        document.getElementById('oledPlantName').innerText = "--";
      } else {
        keys.forEach(k => {
          let opt = document.createElement('option');
          opt.value = k;
          opt.innerText = plantsList[k].name;
          select.appendChild(opt);
        });

        if (!activePlantKey || !plantsList[activePlantKey]) {
          selectPlant(keys[0]);
        } else {
          select.value = activePlantKey;
        }
      }
    });

    function selectPlant(key) {
      if (!key || !plantsList[key]) return;
      activePlantKey = key;
      const p = plantsList[key];

      document.getElementById('oledPlantName').innerText = p.name;

      db.ref('system').update({
        plant: p.name,
        minT: p.minT,
        maxT: p.maxT,
        minH: p.minH,
        maxH: p.maxH
      });
    }

    db.ref('system').on('value', (snapshot) => {
      sysData = snapshot.val() || {};
      renderSystemData();
    });

    function renderSystemData() {
      if (!sysData) return;
      const t = dict[currentLang];

      let tempVal = sysData.temp ?? 0;
      let humVal = sysData.hum ?? 0;
      let modeVal = sysData.mode ?? 'AUTO';
      let fanState = sysData.fan ? 'ON' : 'OFF';

      let minT = sysData.minT ?? -40;
      let maxT = sysData.maxT ?? 80;
      let minH = sysData.minH ?? 0;
      let maxH = sysData.maxH ?? 100;

      // --- تحديث أنيميشن ولون شاشة النمط (AUTO/MANUAL) ---
      let cardSysMode = document.getElementById('cardSysMode');
      let oledMode = document.getElementById('oledMode');
      oledMode.innerText = modeVal;

      if (modeVal.toUpperCase() === 'MANUAL') {
        cardSysMode.className = 'oled-screen card-mode-manual';
        oledMode.style.color = '#a55eea';
      } else {
        cardSysMode.className = 'oled-screen card-mode-auto';
        oledMode.style.color = '#ff9f43';
      }

      if (sysData.plant) {
        document.getElementById('oledPlantName').innerText = sysData.plant;
      }

      // --- التحكم بشاشة الحرارة ---
      document.getElementById('lblCardTemp').innerText = tempVal + ' °C';
      let cardTemp = document.getElementById('cardTemp');
      let lblCardTempStatus = document.getElementById('lblCardTempStatus');

      let isTempHigh = tempVal > maxT;
      let isTempLow = tempVal < minT;

      if (isTempHigh) {
        cardTemp.className = 'oled-screen card-high';
        lblCardTempStatus.innerText = t.high;
      } else if (isTempLow) {
        cardTemp.className = 'oled-screen card-low';
        lblCardTempStatus.innerText = t.low;
      } else {
        cardTemp.className = 'oled-screen card-normal';
        lblCardTempStatus.innerText = t.normal;
      }

      // --- التحكم بشاشة الرطوبة ---
      document.getElementById('lblCardHum').innerText = humVal + ' %';
      let cardHum = document.getElementById('cardHum');
      let lblCardHumStatus = document.getElementById('lblCardHumStatus');

      let isHumHigh = humVal > maxH;
      let isHumLow = humVal < minH;

      if (isHumHigh) {
        cardHum.className = 'oled-screen card-high';
        lblCardHumStatus.innerText = t.high;
      } else if (isHumLow) {
        cardHum.className = 'oled-screen card-low';
        lblCardHumStatus.innerText = t.low;
      } else {
        cardHum.className = 'oled-screen card-normal';
        lblCardHumStatus.innerText = t.normal;
      }

      // --- تحديث أنيميشن وتوهج شاشة المروحة ---
      let elFan = document.getElementById('statusFan');
      let cardFan = document.getElementById('cardFan');
      let isFanOn = fanState.toUpperCase() === 'ON';
      
      elFan.innerText = fanState;
      elFan.className = 'oled-value ' + (isFanOn ? 'status-on' : 'status-off');
      document.getElementById('fanIcon').className = isFanOn ? "fan-icon fan-spinning" : "fan-icon";

      if (isFanOn) {
        cardFan.className = 'oled-screen card-fan-on';
      } else {
        cardFan.className = 'oled-screen card-fan-off';
      }

      // --- حالة النظام العامة ---
      let elSys = document.getElementById('statusSys');
      if (isTempHigh || isTempLow || isHumHigh || isHumLow) {
        elSys.innerText = t.warning;
        elSys.className = 'oled-value status-warn';
      } else {
        elSys.innerText = t.ok;
        elSys.className = 'oled-value status-on';
      }

      // --- العدادات الدائرية ---
      document.getElementById('gTemp').innerText = tempVal; 
      let tempPercent = Math.min(Math.max(((tempVal + 40) / 120) * 100, 0), 100);
      let tempColor = isTempHigh ? '#ff4757' : (isTempLow ? '#1e90ff' : '#2ed573');
      document.getElementById('tempRing').style.setProperty('--percent', tempPercent); 
      document.getElementById('tempRing').style.setProperty('--color', tempColor); 

      document.getElementById('gHum').innerText = humVal; 
      let humPercent = Math.min(Math.max((humVal / 100) * 100, 0), 100);
      let humColor = isHumHigh ? '#ff4757' : (isHumLow ? '#1e90ff' : '#2ed573');
      document.getElementById('humRing').style.setProperty('--percent', humPercent); 
      document.getElementById('humRing').style.setProperty('--color', humColor); 
    }
  </script> 
</body> 
</html>
