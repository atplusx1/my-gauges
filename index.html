<!DOCTYPE html> 
<html lang="ar" dir="rtl"> 
<head> 
  <meta charset="utf-8"> 
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
  <title>ENVIGUARD SYS Dashboard</title> 
  
  <!-- مكتبات Firebase لقراءة البيانات فورياً -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style> 
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: 'Consolas', 'Courier New', monospace; 
    } 
    body { 
      background-color: #080c14; 
      color: #ffffff; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: flex-start; 
      min-height: 100vh; 
      padding: 12px; 
      gap: 15px; 
    } 

    .top-bar {
      width: 100%;
      max-width: 360px;
      display: flex;
      justify-content: flex-end;
    }
    .btn-lang {
      background: #111827;
      border: 1px solid #00d2d3;
      color: #00d2d3;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      font-family: inherit;
      transition: all 0.3s;
    }
    .btn-lang:hover {
      background: #00d2d3;
      color: #000;
    }

    .oled-screen { 
      background: #000000; 
      border: 2px solid #1f293d; 
      border-radius: 12px; 
      padding: 12px 20px; 
      width: 100%; 
      max-width: 360px; 
      box-shadow: 0 0 12px rgba(0, 210, 211, 0.15); 
    } 
    .oled-title { 
      text-align: center; 
      font-size: 16px; 
      font-weight: bold; 
      color: #00d2d3; 
      letter-spacing: 1.5px; 
      border-bottom: 1px dashed #232f48; 
      padding-bottom: 6px; 
      margin-bottom: 10px; 
    } 
    .oled-row { 
      display: flex; 
      justify-content: space-between; 
      align-items: center;
      font-size: 14px; 
      margin: 6px 0; 
      color: #00ffcc; 
    } 
    .oled-value { 
      color: #ffffff; 
      font-weight: bold; 
    } 
    .oled-select {
      background: #080c14;
      border: 1px solid #00d2d3;
      color: #00ffcc;
      padding: 4px 8px;
      border-radius: 6px;
      font-family: inherit;
    }

    .status-on { color: #2ed573 !important; } 
    .status-off { color: #ff4757 !important; } 
    .status-warn { color: #ffa502 !important; } 
    .status-cold { color: #1e90ff !important; }

    .alarm-screen {
      transition: all 0.3s ease;
    }
    .alarm-active {
      border-color: #ff4757 !important;
      box-shadow: 0 0 15px rgba(255, 71, 87, 0.4) !important;
      animation: blink 1s infinite alternate;
    }
    @keyframes blink {
      from { border-color: #ff4757; }
      to { border-color: #570000; }
    }

    /* حركة أجنحة المروحة */
    .fan-icon {
      display: inline-block;
      transition: transform 0.5s linear;
    }
    .fan-spinning {
      animation: spin 1s linear infinite;
      color: #00d2d3;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .gauges-wrapper { 
      display: flex; 
      justify-content: space-around; 
      width: 100%; 
      max-width: 360px; 
      gap: 8px; 
    } 
    .gauge-card { 
      background: #111827; 
      border: 1px solid #1f293d; 
      border-radius: 10px; 
      padding: 8px; 
      flex: 1; 
      text-align: center; 
    } 
    .gauge-title { 
      font-size: 11px; 
      color: #9ca3af; 
      margin-bottom: 6px; 
    } 
    .circle-outer { 
      position: relative; 
      width: 70px; 
      height: 70px; 
      margin: 0 auto; 
      border-radius: 50%; 
      background: conic-gradient(var(--color) calc(var(--percent) * 1%), #1f293d 0); 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      transition: background 0.4s ease; 
      box-shadow: 0 0 8px var(--color); 
    } 
    .circle-inner { 
      width: 56px; 
      height: 56px; 
      background: #111827; 
      border-radius: 50%; 
      display: flex; 
      flex-direction: column; 
      justify-content: center; 
      align-items: center; 
    } 
    .val { 
      font-size: 13px; 
      font-weight: bold; 
    } 
    .unit { 
      font-size: 8px; 
      color: #6b7280; 
    } 
  </style> 
</head> 
<body> 

  <div class="top-bar">
    <button class="btn-lang" onclick="toggleLanguage()" id="langBtn">English 🌐</button>
  </div>

  <!-- كارت اختيار النبات واسم النبات الحالي -->
  <div class="oled-screen"> 
    <div class="oled-title" id="t-plantTitle">🌿 النبات المختار</div> 
    <div class="oled-row"> 
      <span id="t-selectPlant">اختيار النبات:</span> 
      <select id="plantSelector" class="oled-select" onchange="selectPlant(this.value)"></select>
    </div> 
    <div class="oled-row"> 
      <span id="t-activePlant">اسم النبات:</span> 
      <span class="oled-value" id="oledPlantName" style="color: #ff9f43;">--</span> 
    </div> 
  </div> 

  <!-- كارت القراءات الأساسية -->
  <div class="oled-screen"> 
    <div class="oled-title">ENVIGUARD SYS</div> 
    <div class="oled-row"> 
      <span id="t-temp">الحرارة:</span> 
      <span class="oled-value" id="oledTemp">0.0 °C</span> 
    </div> 
    <div class="oled-row"> 
      <span id="t-hum">الرطوبة:</span> 
      <span class="oled-value" id="oledHum">0.0 %</span> 
    </div> 
    <div class="oled-row"> 
      <span id="t-mode">النمط:</span> 
      <span class="oled-value" id="oledMode" style="color: #ff9f43;">AUTO</span> 
    </div> 
  </div> 

  <!-- كارت نظام الإنذار -->
  <div class="oled-screen alarm-screen" id="oledAlarmBox"> 
    <div class="oled-title" id="t-alarmTitle">نظام الإنذار</div> 
    <div class="oled-row"> 
      <span id="t-alarmTemp">إنذار الحرارة:</span> 
      <span class="oled-value status-on" id="alarmTemp">طبيعي</span> 
    </div> 
    <div class="oled-row"> 
      <span id="t-alarmHum">إنذار الرطوبة:</span> 
      <span class="oled-value status-on" id="alarmHum">طبيعي</span> 
    </div> 
  </div> 

  <!-- كارت حالة الأجهزة -->
  <div class="oled-screen"> 
    <div class="oled-title" id="t-actTitle">حالة الأجهزة</div> 
    <div class="oled-row"> 
      <span id="t-fan">المروحة:</span> 
      <span>
        <span class="fan-icon" id="fanIcon">🌀</span>
        <span class="oled-value status-on" id="statusFan">OFF</span> 
      </span>
    </div> 
    <div class="oled-row"> 
      <span id="t-sys">النظام:</span> 
      <span class="oled-value status-warn" id="statusSys">تحذير</span> 
    </div> 
  </div> 

  <!-- العدادات الدائرية -->
  <div class="gauges-wrapper"> 
    <div class="gauge-card"> 
      <div class="gauge-title" id="t-gTemp">الحرارة</div> 
      <div class="circle-outer" id="tempRing" style="--color: #00d2d3; --percent: 0;"> 
        <div class="circle-inner"> 
          <span class="val" id="gTemp">0</span> 
          <span class="unit">°C</span> 
        </div> 
      </div> 
    </div> 

    <div class="gauge-card"> 
      <div class="gauge-title" id="t-gHum">الرطوبة</div> 
      <div class="circle-outer" id="humRing" style="--color: #00d2d3; --percent: 0;"> 
        <div class="circle-inner"> 
          <span class="val" id="gHum">0</span> 
          <span class="unit">%</span> 
        </div> 
      </div> 
    </div> 
  </div> 

  <script> 
    let currentLang = 'ar';
    const dict = {
      ar: {
        langBtn: "English 🌐",
        plantTitle: "🌿 النبات المختار",
        selectPlant: "اختيار النبات:",
        activePlant: "اسم النبات:",
        temp: "الحرارة:",
        hum: "الرطوبة:",
        mode: "النمط:",
        alarmTitle: "نظام الإنذار",
        alarmTemp: "إنذار الحرارة:",
        alarmHum: "إنذار الرطوبة:",
        actTitle: "حالة الأجهزة",
        fan: "المروحة:",
        sys: "النظام:",
        gTemp: "الحرارة",
        gHum: "الرطوبة",
        normal: "طبيعي",
        high: "مرتفعة 🚨",
        low: "منخفضة 🥶",
        ok: "سليم",
        warning: "تحذير"
      },
      en: {
        langBtn: "عربي 🌐",
        plantTitle: "🌿 ACTIVE PLANT",
        selectPlant: "SELECT PLANT:",
        activePlant: "PLANT NAME:",
        temp: "TEMP:",
        hum: "HUMIDITY:",
        mode: "MODE:",
        alarmTitle: "ALARM SYSTEM",
        alarmTemp: "TEMP ALARM:",
        alarmHum: "HUM ALARM:",
        actTitle: "ACTUATOR STATUS",
        fan: "FAN:",
        sys: "SYSTEM:",
        gTemp: "TEMPERATURE",
        gHum: "HUMIDITY",
        normal: "NORMAL",
        high: "HIGH 🚨",
        low: "LOW 🥶",
        ok: "OK",
        warning: "WARNING"
      }
    };

    function toggleLanguage() {
      currentLang = currentLang === 'ar' ? 'en' : 'ar';
      document.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
      const t = dict[currentLang];
      
      document.getElementById('langBtn').innerText = t.langBtn;
      document.getElementById('t-plantTitle').innerText = t.plantTitle;
      document.getElementById('t-selectPlant').innerText = t.selectPlant;
      document.getElementById('t-activePlant').innerText = t.activePlant;
      document.getElementById('t-temp').innerText = t.temp;
      document.getElementById('t-hum').innerText = t.hum;
      document.getElementById('t-mode').innerText = t.mode;
      document.getElementById('t-alarmTitle').innerText = t.alarmTitle;
      document.getElementById('t-alarmTemp').innerText = t.alarmTemp;
      document.getElementById('t-alarmHum').innerText = t.alarmHum;
      document.getElementById('t-actTitle').innerText = t.actTitle;
      document.getElementById('t-fan').innerText = t.fan;
      document.getElementById('t-sys').innerText = t.sys;
      document.getElementById('t-gTemp').innerText = t.gTemp;
      document.getElementById('t-gHum').innerText = t.gHum;

      renderSystemData();
    }

    // --- إعداد Firebase ---
    const firebaseConfig = {
      databaseURL: "https://envigurd-default-rtdb.firebaseio.com"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let plantsList = {};
    let activePlantKey = "";
    let sysData = {};

    // قراءة قائمة النباتات من الكلاود
    db.ref('plants').on('value', (snapshot) => {
      plantsList = snapshot.val() || {};
      const select = document.getElementById('plantSelector');
      select.innerHTML = '';
      
      let keys = Object.keys(plantsList);
      keys.forEach(k => {
        let opt = document.createElement('option');
        opt.value = k;
        opt.innerText = plantsList[k].name;
        select.appendChild(opt);
      });

      if (keys.length > 0 && !activePlantKey) {
        selectPlant(keys[0]);
      }
    });

    // إرسال بيانات النبات المحدد للسحابة
    function selectPlant(key) {
      if(!plantsList[key]) return;
      activePlantKey = key;
      const p = plantsList[key];

      document.getElementById('oledPlantName').innerText = p.name;

      db.ref('system').update({
        plant: p.name,
        minT: p.minT,
        maxT: p.maxT,
        minH: p.minH,
        maxH: p.maxH
      });
    }

    // قراءة بيانات النظام الحية من الكلاود
    db.ref('system').on('value', (snapshot) => {
      sysData = snapshot.val() || {};
      renderSystemData();
    });

    function renderSystemData() {
      if (!sysData) return;
      const t = dict[currentLang];

      let tempVal = sysData.temp ?? 0;
      let humVal = sysData.hum ?? 0;
      let modeVal = sysData.mode ?? 'AUTO';
      let fanState = sysData.fan ? 'ON' : 'OFF';

      let minT = sysData.minT ?? -10;
      let maxT = sysData.maxT ?? 35;
      let minH = sysData.minH ?? 30;
      let maxH = sysData.maxH ?? 80;

      // تحديث قراءات OLED الأساسية
      document.getElementById('oledTemp').innerText = tempVal + ' °C'; 
      document.getElementById('oledHum').innerText = humVal + ' %'; 
      document.getElementById('oledMode').innerText = modeVal; 

      if(sysData.plant) {
        document.getElementById('oledPlantName').innerText = sysData.plant;
      }

      // حساب الإنذارات الملونة
      let isTempHigh = tempVal > maxT;
      let isTempLow = tempVal < minT;
      let isHumHigh = humVal > maxH;
      let isHumLow = humVal < minH;

      let elTemp = document.getElementById('alarmTemp');
      let elHum = document.getElementById('alarmHum');
      let box = document.getElementById('oledAlarmBox');

      // إنذار الحرارة (أحمر للارتفاع، أزرق للانخفاض، أخضر للطبيعي)
      if (isTempHigh) {
        elTemp.innerText = t.high;
        elTemp.className = 'oled-value status-off';
      } else if (isTempLow) {
        elTemp.innerText = t.low;
        elTemp.className = 'oled-value status-cold';
      } else {
        elTemp.innerText = t.normal;
        elTemp.className = 'oled-value status-on';
      }

      // إنذار الرطوبة
      if (isHumHigh) {
        elHum.innerText = t.high;
        elHum.className = 'oled-value status-off';
      } else if (isHumLow) {
        elHum.innerText = t.low;
        elHum.className = 'oled-value status-cold';
      } else {
        elHum.innerText = t.normal;
        elHum.className = 'oled-value status-on';
      }

      // إضاءة صندوق الإنذار الكلي
      if (isTempHigh || isTempLow || isHumHigh || isHumLow) {
        box.classList.add('alarm-active');
      } else {
        box.classList.remove('alarm-active');
      }

      // تحديث المروحة وتأثير الحركة
      let elFan = document.getElementById('statusFan');
      let isFanOn = fanState.toUpperCase() === 'ON';
      elFan.innerText = fanState;
      elFan.className = 'oled-value ' + (isFanOn ? 'status-on' : 'status-off');
      document.getElementById('fanIcon').className = isFanOn ? "fan-icon fan-spinning" : "fan-icon";

      // حالة النظام
      let elSys = document.getElementById('statusSys');
      if (isTempHigh || isTempLow || isHumHigh || isHumLow) {
        elSys.innerText = t.warning;
        elSys.className = 'oled-value status-warn';
      } else {
        elSys.innerText = t.ok;
        elSys.className = 'oled-value status-on';
      }

      // تحديث العدادات الدائرية
      document.getElementById('gTemp').innerText = tempVal; 
      let tempPercent = Math.min(Math.max(((tempVal + 40) / 100) * 100, 0), 100);
      let tempColor = isTempHigh ? '#ff4757' : (isTempLow ? '#1e90ff' : '#00d2d3');
      document.getElementById('tempRing').style.setProperty('--percent', tempPercent); 
      document.getElementById('tempRing').style.setProperty('--color', tempColor); 

      document.getElementById('gHum').innerText = humVal; 
      let humPercent = Math.min(Math.max(humVal, 0), 100);
      let humColor = isHumHigh ? '#ff4757' : (isHumLow ? '#1e90ff' : '#00d2d3');
      document.getElementById('humRing').style.setProperty('--percent', humPercent); 
      document.getElementById('humRing').style.setProperty('--color', humColor); 
    }
  </script> 
</body> 
</html>
